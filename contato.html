<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore o Mundo - Expedition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="ty.png" alt="+tour">
        </div>
        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobrenos.html">Sobre Nós</a>
                <a href="contato.html">Contato</a>
            </nav>
            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="face"><i class="fa-brands fa-facebook"></i></a>
                <a href="" class="insta"><i class="fa-brands fa-instagram"></i></a>
               <a href="" class="twitter"><i class="fa-brands fa-square-x-twitter"></i></a>
            </div>
        </div>
    </header>
    <main class="container">
    <section class="secao">
        <h1>Cadastro Para Entrar em Contato</h1>
        <p class="subtitulo">Preencha seus dados para realizar a sua reclamação para a +Tour</p>

        <div class="area-inscricao">
            
            <form action="/processar-cadastro" method="post" class="coluna-form">
                
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required minlength="3" maxlength="100">
                
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required minlength="8" maxlength="15">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>

                <label for="data_nasc">Data de Nascimento</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required>

                <label for="reclamacao">Sua Reclamação:</label>
                <input type="text" id="reclamacao" name="reclamacao" minlength="10" required>

                <input type="checkbox" name="termos" id="termos" required>
                <label for="termos">Li e Aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>

            </form>
        </section>
    </main>
<footer>        
    <p>© 2026 +Tour - Todos os direitos reservados</p>
</footer>
</body>
</html>
